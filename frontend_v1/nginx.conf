map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream omnipulse_api {
    # merged compose stack: the backend container is named "backend"
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Live firehoses: WebSocket upgrade, no buffering for SSE / NDJSON.
    location /v1/stream {
        proxy_pass http://omnipulse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/(v1|mcp|docs|redoc|openapi\.json|llms\.txt|healthz|readyz|websub) {
        proxy_pass http://omnipulse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 330s;  # MCP wait_for_events may block up to 300 s
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
