name: omnipulse

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: omnipulse-postgres
    environment:
      POSTGRES_DB: omnipulse
      POSTGRES_USER: omnipulse
      POSTGRES_PASSWORD: omnipulse
    ports:
      - "5432:5432"
    volumes:
      - omnipulse-pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipulse -d omnipulse"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: omnipulse-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: omnipulse-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OMNIPULSE_ENV: production
      # merged engine profile: v2 (default, /api/*) or v1 (Redis-stream pipeline, /v1/*)
      OMNIPULSE_PROFILE: ${OMNIPULSE_PROFILE:-v2}
      OMNIPULSE_DATABASE_URL: postgresql://omnipulse:omnipulse@postgres:5432/omnipulse
      OMNIPULSE_REDIS_URL: redis://redis:6379/0
      OMNIPULSE_SOURCES_FILE: /app/config/default_sources.json
      OMNIPULSE_PUBLIC_URL: http://localhost:8000
      # ---- v1 profile (OMNI_* namespace; used only when OMNIPULSE_PROFILE=v1) ----
      OMNI_MODE: ${OMNI_MODE:-full}
      OMNI_REDIS_URL: redis://redis:6379/0
      OMNI_DATABASE_URL: postgresql://omnipulse:omnipulse@postgres:5432/omnipulse
      OMNI_SOURCES_FILE: /app/config/v1_sources.json
      OMNI_EMBEDDER: ${OMNI_EMBEDDER:-hash}
      # ---- LLM enrichment (any OpenAI-compatible endpoint; set via .env, never committed) ----
      OMNIPULSE_LLM_PROVIDER: ${OMNIPULSE_LLM_PROVIDER:-auto}
      OMNIPULSE_LLM_BASE_URL: ${OMNIPULSE_LLM_BASE_URL:-}
      OMNIPULSE_LLM_API_KEY: ${OMNIPULSE_LLM_API_KEY:-}
      OMNIPULSE_LLM_MODEL: ${OMNIPULSE_LLM_MODEL:-}
      OMNI_LLM_PROVIDER: ${OMNI_LLM_PROVIDER:-none}
      OMNI_LLM_BASE_URL: ${OMNI_LLM_BASE_URL:-}
      OMNI_LLM_API_KEY: ${OMNI_LLM_API_KEY:-}
      OMNI_LLM_MODEL: ${OMNI_LLM_MODEL:-}
      # Optional keyed enrichment / connectors (system is fully functional without any of these):
      # OMNIPULSE_OPENAI_API_KEY: sk-...
      # OMNIPULSE_ANTHROPIC_API_KEY: sk-ant-...
      # OMNIPULSE_OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Terminal UI. Default ./frontend ships BOTH skins (tape ⇄ tiling) over the
  # one merged engine — switchable in the browser, no second container needed.
  #   TERMINAL_DIR=frontend_v1  → the standalone v1 terminal (only for the v1 engine profile)
  frontend:
    build: ${TERMINAL_DIR:-./frontend}
    container_name: omnipulse-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  # Stdio MCP server for AI agents (v2 profile; the v1 profile instead serves
  # streamable-HTTP MCP at http://localhost:8000/mcp through the backend).
  # Run with: docker compose --profile agents up -d
  # then attach: docker attach omnipulse-mcp  (or run natively: python -m app.mcp_server)
  mcp:
    build: ./backend
    container_name: omnipulse-mcp
    profiles: ["agents"]
    depends_on:
      - backend
    environment:
      OMNIPULSE_API_URL: http://backend:8000
    command: ["python", "-m", "app.mcp_server"]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  omnipulse-pgdata:
